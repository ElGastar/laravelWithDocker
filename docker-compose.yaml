version: '3.8'

services:
  nginx:
    image: "nginx:stable-alpine"
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/laravel:cached # :cached ускоряет работу на macOS/Windows
    depends_on:
      - php
      - mysql
    networks:
      - laravel-network

  php:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        - UID=${UID:-1000} # Передаем UID пользователя хоста
        - GID=${GID:-1000} # Передаем GID пользователя хоста
    container_name: laravel-php
    restart: unless-stopped
    volumes:
      - ./src:/var/www/laravel:cached
    environment:
      - DB_HOST=mysql
      - DB_DATABASE=${DB_DATABASE:-laravel}
      - DB_USERNAME=${DB_USERNAME:-laravel}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
    depends_on:
      mysql:
        condition: service_healthy # Ждем, пока MySQL не станет здоровым
    networks:
      - laravel-network

  mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    restart: unless-stopped
    ports:
      - "3316:3306"
    env_file:
      - env/mysql.env
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel-network

  composer: # Оставляем как временный сервис для запуска команд
    image: composer:2.7 # Используем официальный образ
    container_name: laravel-composer
    working_dir: /var/www/laravel
    volumes:
      - ./src:/var/www/laravel:cached
    entrypoint: ["composer"]
    networks:
      - laravel-network

  artisan: # Делаем его тоже временным, чтобы не дублировать сборку
    image: composer:2.7 # Временный образ на основе PHP + Composer
    container_name: laravel-artisan
    working_dir: /var/www/laravel
    volumes:
      - ./src:/var/www/laravel:cached
    entrypoint: ["php", "/var/www/laravel/artisan"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laravel-network

volumes:
  db_data:

networks: # Создаем свою сеть
  laravel-network:
    driver: bridge