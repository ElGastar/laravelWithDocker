services:
  nginx:
    image: "nginx:stable-alpine"
    container_name: laravel-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/laravel:cached
    depends_on:
      - php
      - mysql
    networks:
      - laravel-network

  php:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    container_name: laravel-php
    restart: unless-stopped
    volumes:
      - ./src:/var/www/laravel:cached
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-laravel_db}
      - DB_USERNAME=${DB_USERNAME:-laravel}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laravel-network

  mysql:
    image: mysql:8.0
    container_name: laravel-mysql
    restart: unless-stopped
    ports:
      - "3316:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: laravel_db
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - laravel-network

  composer:
    image: composer:2.7
    container_name: laravel-composer
    working_dir: /var/www/laravel
    volumes:
      - ./src:/var/www/laravel:cached
    entrypoint: ["composer"]
    networks:
      - laravel-network

  artisan:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
      args:
        - UID=${UID:-1000}
        - GID=${GID:-1000}
    container_name: laravel-artisan
    working_dir: /var/www/laravel
    volumes:
      - ./src:/var/www/laravel:cached
    entrypoint: ["php", "/var/www/laravel/artisan"]
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - laravel-network
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=laravel_db
      - DB_USERNAME=laravel
      - DB_PASSWORD=password

volumes:
  db_data:

networks:
  laravel-network:
    driver: bridge